name: Build AirWin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4

      - name: Manually clone OWDL dependency
        run: git clone https://github.com/seregonwar/OWDL.git OWDL

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: airwin-windows
          path: target/release/airwin.exe
